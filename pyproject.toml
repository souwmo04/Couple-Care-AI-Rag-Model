[project]
name = "couplecare-ai"
version = "0.1.0"
description = "Bilingual (English/Bangla/Banglish) relationship-advice assistant with local LLM inference and RAG."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
asyncio_mode = "auto"
markers = [
  "integration: requires a running local model server and/or downloaded embedding model (skipped by default)",
]
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = ["S101", "S311"]

[tool.ruff.lint.per-file-ignores]
"backend/tests/**" = ["S", "B"]
