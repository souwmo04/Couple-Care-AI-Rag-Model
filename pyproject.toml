[project]
name = "couplecare-ai"
version = "0.1.0"
description = "Bilingual (English/Bangla/Banglish) relationship-advice assistant with local LLM inference and RAG."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
asyncio_mode = "auto"
markers = [
  "integration: requires a running local model server and/or downloaded embedding model (skipped by default)",
]
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = ["S101", "S311", "B008", "SIM905"]  # B008: FastAPI Depends() defaults

[tool.ruff.lint.per-file-ignores]
"backend/tests/**" = ["S", "B", "E501"]
# Regex tables and trilingual templates are clearer unwrapped.
"backend/app/safety/**" = ["E501"]
"backend/app/core/language.py" = ["E501"]
"backend/app/storage/sessions.py" = ["E501"]  # long SQL strings
"scripts/diagnose.py" = ["E501"]  # report strings
"scripts/build_eval_dataset.py" = ["E501"]  # scenario templates
"scripts/run_evaluation.py" = ["E501", "S603", "S607"]  # git/nvidia-smi calls
"scripts/benchmark_model.py" = ["E501", "S603", "S607"]
"scripts/language_fidelity.py" = ["E501"]
"backend/app/evaluation/**" = ["E501"]
